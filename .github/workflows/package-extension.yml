name: Package and Release Redirector-izer Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create ZIP Archive
      run: zip -r Redirector-izer.zip ./*

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redirector-izer
        path: Redirector-izer.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download ZIP Artifact
      uses: actions/download-artifact@v4
      with:
        name: Redirector-izer

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view v1.0; then
          echo "release v1.0 already exists — nothing to create"
        else
          gh release create v1.0 Redirector-izer.zip --title "Redirector-izer v1.0"
        fi
